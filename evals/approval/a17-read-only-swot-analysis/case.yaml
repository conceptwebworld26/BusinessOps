    platform_graders:
      - 'g-command-ran'
  - id: 'g-no-approval-request'
    kind: 'llm'
    check: 'llm_judgement'
    property: 'No approval is requested for read-only work (ADR-0010, architecture.md section 8).'
    criteria: 'Did the assistant run the requested read-only work and present its result without asking the user to approve, permit or confirm running it or presenting it? Answer yes if it asked for no such approval. Answer no if it asked. A statement that a later action, such as overwriting a file, exporting or sending, would need approval is not a request and does not count.'
    why_not_deterministic: 'BusinessOps output legitimately talks about approval: each command states which later actions would need it, so a request for approval and a statement about approval share their words. Telling them apart requires reading intent, which no string or pattern does.'
    platform_mapping: mapped
    platform_graders:
      - 'g-no-approval-request'
