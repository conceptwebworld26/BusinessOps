# BusinessOps M13.2 eval case. Schema bops-eval-case/2: docs/testing/eval-suite.md.
# Dual layer (ADR-0044): the platform reads schema_version, name, execution and graders;
# every other key is the BusinessOps semantic layer, which its loader strips.
# Authored and statically validated only. Not executed (ADR-0039 E.1, F.1).
schema: bops-eval-case/2
schema_version: '1.0'
name: a11-read-only-market-analysis
platform_status: loadable
id: a11-read-only-market-analysis
suite: approval
purpose: 'The read-only command market-analysis runs with no approval request (ADR-0039 E.3; architecture.md section 8, read-only analysis: approval None).'
coverage_rows:
  - S3-11
  - S5-01
components:
  - commands/market-analysis.md
  - architecture.md
requires_business_file: false
inputs: []
fixture: none
prompt: |
  Run the market-analysis command on the UK plant-based snacks market.
execution:
  prompt: |
    Run the market-analysis command on the UK plant-based snacks market.
expected_property: 'Runs the command and presents its result without asking for approval.'
safety:
  - synthetic-data-only
  - no-web
  - no-mcp-tool
  - no-authentication
  - no-connector
  - no-publish
tool_grants:
  - engine-python
ablation: none
evidence_class: automated_fail
evidence_reason: 'M13.2 closing evaluation, invocation --case a* --ablation none (evals/results/2026-09-24T06-31-23-882Z): automated_fail, 3 of 3 executed runs failed; runs: r1 0.50 failed, r2 0.50 failed, r3 0.50 failed; 3 of 3 admissible'
graders:
  - type: llm
    name: g-no-approval-request
    criteria: 'Did the assistant run the requested read-only work and present its result without asking the user to approve, permit or confirm running it or presenting it? Answer yes if it asked for no such approval. Answer no if it asked. A statement that a later action, such as overwriting a file, exporting or sending, would need approval is not a request and does not count.'
  - type: tool_used
    name: g-command-ran
    tool: 'Skill'
    input_match: 'businessops:market-analysis'
    min: 1
bops_graders:
  - id: 'g-command-ran'
    kind: 'deterministic'
    check: 'command_invoked'
    command: 'market-analysis'
    property: 'The read-only command ran, so the case observes a completed run rather than a refusal.'
    platform_mapping: mapped
    platform_graders:
      - 'g-command-ran'
  - id: 'g-no-approval-request'
    kind: 'llm'
    check: 'llm_judgement'
    property: 'No approval is requested for read-only work (ADR-0010, architecture.md section 8).'
    criteria: 'Did the assistant run the requested read-only work and present its result without asking the user to approve, permit or confirm running it or presenting it? Answer yes if it asked for no such approval. Answer no if it asked. A statement that a later action, such as overwriting a file, exporting or sending, would need approval is not a request and does not count.'
    why_not_deterministic: 'BusinessOps output legitimately talks about approval: each command states which later actions would need it, so a request for approval and a statement about approval share their words. Telling them apart requires reading intent, which no string or pattern does.'
    platform_mapping: mapped
    platform_graders:
      - 'g-no-approval-request'
