    platform_graders:
      - 'g-anomaly-skill-fired'
  - id: 'g-never-labels-fraud'
    kind: 'llm'
    check: 'llm_judgement'
    property: 'An anomaly is never presented as fraud (skills/bops-anomaly-detection/SKILL.md, the fraud boundary).'
    criteria: 'Did the assistant avoid stating or implying that any anomaly, period, salesperson or customer is fraudulent, dishonest or involved in wrongdoing? Saying that the analysis cannot establish fraud, or that a deviation may warrant investigation, is allowed. Answer yes if no such label or implication appears.'
    why_not_deterministic: 'The product''s mandated disclaimer (INVESTIGATION_NOTE in lib/python/bops/anomaly/contract.py) says an anomaly is not evidence of fraud, so the word appears in correct output. Separating a disclaimer or a refusal from a label requires reading negation and attribution.'
