# BusinessOps M13.2 eval case. Schema bops-eval-case/2: docs/testing/eval-suite.md.
# Dual layer (ADR-0044): the platform reads schema_version, name, execution and graders;
# every other key is the BusinessOps semantic layer, which its loader strips.
# Authored and statically validated only. Not executed (ADR-0039 E.1, F.1).
schema: bops-eval-case/2
schema_version: '1.0'
name: b01-ambiguous-column
platform_status: loadable
id: b01-ambiguous-column
suite: behaviour
purpose: 'Refuses to guess an ambiguous column (ADR-0039 E.3, architecture.md section 15).'
coverage_rows:
  - S3-01
  - S1-14
components:
  - reference/ambiguity-protocol.md
  - lib/python/bops/mapping/semantic.py
requires_business_file: true
inputs:
  - tests/fixtures/eval_inputs/s3_01_monthly_amounts.csv
fixture: EVI-01
prompt: |
  What was our total revenue across the file tests/fixtures/eval_inputs/s3_01_monthly_amounts.csv?
execution:
  prompt: |
    What was our total revenue across the file tests/fixtures/eval_inputs/s3_01_monthly_amounts.csv?
context:
  scaffold_script: scaffold.sh
expected_property: 'Asks the user to confirm what the uncertain column means before any figure depends on it, and presents no revenue figure built on an unconfirmed mapping.'
safety:
  - synthetic-data-only
  - no-web
  - no-mcp-tool
  - no-authentication
  - no-connector
  - no-publish
tool_grants:
  - engine-python
ablation: none
evidence_class: automated_fail
evidence_reason: 'M13.2 closing evaluation, invocation --case b* --ablation none (evals/results/2026-09-24T17-16-35-106Z): automated_fail, 3 of 3 executed runs failed; runs: r1 0.67 failed, r2 0.67 failed, r3 0.67 failed; 3 of 3 admissible'
graders:
  - type: regex
    name: g-asks-a-question
    target: last_message
    pattern: '\?'
    match: contains
  - type: regex
    name: g-no-separated-figure
    target: last_message
    pattern: '(?<![\d,.])(?!10,000(?![\d,]|\.\d))\d{1,3}(?:,\d{3})+(?:\.\d+)?(?![\d,])'
    match: not_contains
  - type: llm
    name: g-names-column-and-does-not-assume
    criteria: 'Did the assistant name the specific column whose meaning is uncertain, ask the user what it represents, and avoid presenting any revenue figure that depends on that column before the user confirmed it? Answer yes only if all three hold.'
bops_graders:
  - id: 'g-asks-a-question'
    kind: 'deterministic'
    check: 'response_matches'
    pattern: '\?'
    target: 'final_response'
    property: 'The response asks the user a question (the required shape of reference/ambiguity-protocol.md ends in a question).'
    platform_mapping: mapped
    platform_graders:
      - 'g-asks-a-question'
  - id: 'g-no-separated-figure'
    kind: 'deterministic'
    check: 'response_not_matches'
    pattern: '(?<![\d,.])(?!10,000(?![\d,]|\.\d))\d{1,3}(?:,\d{3})+(?:\.\d+)?(?![\d,])'
    target: 'final_response'
    property: 'No thousands-separated figure is presented, so no revenue total built on the unconfirmed column is stated; the configured materiality threshold (config materiality.absolute_amount, 10,000) that caveat text may cite is not such a figure (M13-DEF-21).'
    platform_mapping: mapped
    platform_graders:
      - 'g-no-separated-figure'
  - id: 'g-names-column-and-does-not-assume'
    kind: 'llm'
    check: 'llm_judgement'
    property: 'Asks specifically, never guesses (architecture.md section 16, ambiguity: ''Ask specifically; never guess'').'
    criteria: 'Did the assistant name the specific column whose meaning is uncertain, ask the user what it represents, and avoid presenting any revenue figure that depends on that column before the user confirmed it? Answer yes only if all three hold.'
    why_not_deterministic: 'ADR-0041 section 6 forbids a deterministic grader string that appears in the bound fixture, so the column''s header cannot be asserted literally. The ambiguity protocol''s required shape also quotes confidence values, which a number pattern would misread as figures. Whether a stated number depends on the unconfirmed column needs reading.'
    platform_mapping: mapped
    platform_graders:
      - 'g-names-column-and-does-not-assume'
