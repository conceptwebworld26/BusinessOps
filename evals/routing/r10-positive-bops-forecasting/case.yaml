coverage_rows:
  - S3-12
components:
  - skills/bops-forecasting/SKILL.md
requires_business_file: true
inputs:
  - assets/demo-data/northwind_sales.csv
fixture: none
prompt: |
  What will revenue be over the next six months, based on assets/demo-data/northwind_sales.csv?
execution:
  prompt: |
    What will revenue be over the next six months, based on assets/demo-data/northwind_sales.csv?
context:
