# Authored and statically validated only. Not executed (ADR-0039 E.1, F.1).
schema: bops-eval-case/2
schema_version: '1.0'
name: r10-positive-bops-forecasting
platform_status: loadable
id: r10-positive-bops-forecasting
suite: routing
purpose: 'Positive routing: a request squarely within bops-forecasting fires that skill (ADR-0039 E.3).'
