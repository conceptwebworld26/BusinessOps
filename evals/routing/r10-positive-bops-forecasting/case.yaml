    kind: 'deterministic'
    check: 'skill_invoked'
    skill: 'bops-forecasting'
    property: 'The intended skill fired: the ablation''s plugin-fired indicator (ADR-0039 F.8).'
    platform_mapping: mapped
    platform_graders:
